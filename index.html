<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projeto Didelphis</title>
<style>
:root{--bg:#f6f7f5;--fg:#1d2b24;--card:#fff;--bd:#d5dcd7;--ac:#2f6f4f;--mut:#6b7a72}
@media(prefers-color-scheme:dark){:root{--bg:#151a17;--fg:#e6ece8;--card:#1f2622;--bd:#33403a;--ac:#5fb88a;--mut:#97a69d}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{margin-right:4px}main{padding:16px;max-width:1100px;margin:auto}
button,select,input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.p,nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
textarea{width:100%;min-height:70px;margin:4px 0}input{width:100%}
.grid{display:grid;grid-template-columns:260px 1fr;gap:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.item{padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}.item.on,.item:hover{border-color:var(--ac)}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.f label{font-size:12px;color:var(--mut)}
.chip{margin:2px;border-radius:99px;padding:3px 10px;font-size:13px}.chip.on{background:var(--ac);color:#fff}
.st{display:inline-block;margin:3px;padding:2px 9px;border-radius:99px;font-size:12px;cursor:pointer;border:1px solid var(--bd)}
.s0{background:#fde7c8;color:#6a4200}.s1{background:#d9e7fb;color:#143a73}.s2{background:#e6dcf7;color:#43257a}.s3{background:#d4efdf;color:#17543a}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}.mut{color:var(--mut);font-size:13px}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--bd)}
@media print{header,button,.noprint{display:none!important}}
</style><script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script></head><body>
<header><b>🐾 Projeto Didelphis</b><nav id="nav"></nav></header><main id="app"></main>
<script>
const L=['Rascunho','Dúvidas p/ professor','Em correção','Aguardando assinatura','Assinado'];
const S=['Pendente','Cortada','Corada','Lida'];
const EX=['Necropsia','Histopatologia','Bacteriologia','Toxicológico','Virológico','Parasitológico','Outros'];
const DEF={cols:['Gram','PAS','Giemsa','Azul de toluidina','Ziehl-Neelsen','Masson','Tricrômico','Von Kossa','Vermelho Congo','IHQ CDV'],
orgaos:['Pulmão','Estômago','Esôfago','Intestino delgado','Intestino grosso','Ceco','Fígado','Baço','Rim','Coração','Encéfalo','Língua','Pele','Linfonodo','Tireoide','Pâncreas','Útero','Testículo'],
quem:['Renato','Ayisa','Eu']};
let db=JSON.parse(localStorage.getItem('didelphis')||'null')||{cases:[],slides:[],duv:[],cfg:DEF};
let v={tab:'casos',cid:null,sub:'lam',q:'',quem:db.cfg.quem[0],f:'-1'};
const save=()=>localStorage.setItem('didelphis',JSON.stringify(db));
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const C=()=>db.cases.find(x=>x.id==v.cid);
const today=()=>new Date().toISOString().slice(0,10);
const br=d=>d?d.split('-').reverse().join('/'):'';
const slOf=id=>db.slides.filter(s=>s.caso==id).sort((a,b)=>a.num-b.num||0);
const go=(k,x)=>{Object.assign(v,k);render()};

function render(){
 nav.innerHTML=[['casos','Casos'],['fila','Fila de colorações'],['pauta','Pauta do professor'],['dados','Dados / backup']]
 .map(([k,n])=>`<button class="${v.tab==k?'on':''}" onclick="go({tab:'${k}'})">${n}</button>`).join('');
 app.innerHTML={casos:vCasos,fila:vFila,pauta:vPauta,dados:vDados}[v.tab]();
}
/* ---------- CASOS ---------- */
function vCasos(){
 const l=db.cases.filter(c=>(c.reg+c.proc).toLowerCase().includes(v.q.toLowerCase()));
 return `<div class=grid><div><div class=row><input placeholder="Buscar registro/local" value="${esc(v.q)}" onchange="v.q=this.value;render()"><button class=p onclick="novo()">＋ Novo caso</button></div>
 ${l.map(c=>{const pend=slOf(c.id).flatMap(s=>s.cols).filter(r=>r.st<3).length;
 return `<div class="item ${c.id==v.cid?'on':''}" onclick="go({cid:'${c.id}'})"><b>${esc(c.reg)}</b> <span class=tag>${c.tipo||''}</span><div class=mut>${esc(c.proc||'')} · ${L[c.st||0]}${pend?` · ⏳${pend}`:''}</div></div>`}).join('')||'<p class=mut>Nenhum caso ainda. Clique em “Novo caso” ou importe a planilha em “Dados”.</p>'}
 </div><div>${C()?vCaso():'<p class=mut>Selecione um caso.</p>'}</div></div>`;
}
function novo(){const r=prompt('Registro do caso (ex.: 26/1200):');if(!r)return;
 const c={id:uid(),reg:r,esp:'Didelphis albiventris',nome:'Gambá de Orelha Branca',tipo:'Prospectivo',st:0,ex:['Necropsia','Histopatologia'],mat:'Carcaça',
 pat:'Professor Dr. Renato de Lima Santos - CRMV MG 4577',pos:'André Duarte Vieira – CRMV MG-34985',dn:today()};
 db.cases.unshift(c);save();go({cid:c.id,sub:'lam'})}
const fld=(k,l,t='text')=>`<div><label>${l}</label><input type=${t} value="${esc(C()[k])}" onchange="setC('${k}',this.value)"></div>`;
const setC=(k,x)=>{C()[k]=x;save()};
function vCaso(){const c=C();
 return `<div class=card><div class=row><h3 style="margin:0">${esc(c.reg)}</h3><span><select onchange="setC('tipo',this.value)">${['Prospectivo','Retrospectivo'].map(t=>`<option ${c.tipo==t?'selected':''}>${t}</option>`).join('')}</select>
 <button onclick="delC()">🗑</button></span></div></div>
 <div class=noprint>${[['lam','Lâminas e colorações'],['laudo','Laudo'],['duv','Dúvidas / correções']].map(([k,n])=>`<button class="${v.sub==k?'on':''}" onclick="go({sub:'${k}'})">${n}</button>`).join(' ')}</div>
 ${{lam:vLam,laudo:vLaudo,duv:vDuv}[v.sub]()}`}
function delC(){if(confirm('Excluir este caso e suas lâminas?')){db.slides=db.slides.filter(s=>s.caso!=v.cid);db.duv=db.duv.filter(d=>d.caso!=v.cid);db.cases=db.cases.filter(x=>x.id!=v.cid);v.cid=null;save();render()}}
/* ---------- LÂMINAS ---------- */
function vLam(){const sl=slOf(v.cid),n=(sl.at(-1)?.num||0)+1;
 return `<div class=card><div class=row><b>Quem pediu a coloração?</b><select onchange="v.quem=this.value">${db.cfg.quem.map(q=>`<option ${v.quem==q?'selected':''}>${q}</option>`).join('')}</select></div>
 <div class=row style="margin-top:8px"><input id=sn type=number value=${n} style="width:80px"><input id=so list=ol placeholder="Órgão" style="flex:1"><datalist id=ol>${db.cfg.orgaos.map(o=>`<option>${o}</option>`).join('')}</datalist><button class=p onclick="addSl()">＋ Lâmina</button></div></div>
 ${sl.map(s=>`<div class=card><div class=row><b>Lâmina ${s.num} – ${esc(s.org||'órgão a definir')}</b><span><button onclick="edOrg('${s.id}')">✏ órgão</button> <button onclick="delSl('${s.id}')">🗑</button></span></div>
 <div>${db.cfg.cols.map(n=>`<button class="chip ${s.cols.some(r=>r.n==n)?'on':''}" onclick="togCol('${s.id}','${n}')">${n}</button>`).join('')}<button class=chip onclick="outra('${s.id}')">＋ outra</button></div>
 <div>${s.cols.map((r,i)=>`<span class="st s${r.st}" onclick="cyc('${s.id}',${i})" title="Clique para avançar">${esc(r.n)} · ${S[r.st]} · ${esc(r.q)} ↻</span>`).join('')}</div>
 <textarea placeholder="Descrição microscópica (vai para a Histopatologia do laudo)" onchange="setSl('${s.id}','desc',this.value)">${esc(s.desc)}</textarea></div>`).join('')||'<p class=mut>Cadastre as lâminas do caso.</p>'}`}
function addSl(){const o=so.value.trim();if(!o)return;db.slides.push({id:uid(),caso:v.cid,num:+sn.value,org:o,cols:[],desc:''});save();render()}
const delSl=id=>{if(confirm('Excluir lâmina?')){db.slides=db.slides.filter(s=>s.id!=id);save();render()}};
const sl1=id=>db.slides.find(s=>s.id==id);
function togCol(id,n){const s=sl1(id),i=s.cols.findIndex(r=>r.n==n);
 if(i<0)s.cols.push({n,q:v.quem,st:0,d:today()});else if(s.cols[i].st==0)s.cols.splice(i,1);save();render()}
function outra(id){const n=prompt('Nome da coloração:');if(n){sl1(id).cols.push({n,q:v.quem,st:0,d:today()});save();render()}}
function cyc(id,i){const r=sl1(id).cols[i];r.st=(r.st+1)%4;r.d=today();save();render()}
const setSl=(id,k,x)=>{sl1(id)[k]=x;save()};
/* ---------- LAUDO ---------- */
function histo(c){return slOf(c.id).map(s=>{const p=[s.org,s.cols.length?'HE + '+s.cols.map(r=>r.n).join(', '):''].filter(Boolean).join('; ');return `${s.num}${p?` (${p})`:''}: ${s.desc||'[descrever]'}`})}
function vLaudo(){const c=C(),nd=db.duv.filter(d=>d.caso==c.id&&!d.ok).length;
 const ta=(k,l,h=90)=>`<label class=mut>${l}</label><textarea style="min-height:${h}px" onchange="setC('${k}',this.value)">${esc(c[k])}</textarea>`;
 return `<div class=card><div class=row><b>Status do laudo</b><select onchange="setC('st',+this.value);render()">${L.map((t,i)=>`<option value=${i} ${c.st==i?'selected':''}>${t}</option>`).join('')}</select></div>
 ${nd?`<p class=mut>⚠ ${nd} dúvida(s)/correção(ões) em aberto.</p>`:''}</div>
 <div class=card><b>Identificação</b><div class=f>${fld('prop','Proprietário')}${fld('proc','Procedência')}${fld('nome','Nome')}${fld('esp','Espécie')}${fld('peso','Peso')}${fld('idade','Idade')}${fld('sexo','Sexo')}${fld('morte','Morte (ex.: Natural)')}${fld('do','Data do óbito','date')}${fld('dn','Data da necropsia','date')}${fld('dr','Data de recebimento','date')}${fld('vet','Veterinário responsável')}${fld('pat','Patologista responsável')}${fld('pos','Pós-graduando responsável')}</div>
 <p>${EX.map(e=>`<label><input type=checkbox style="width:auto" ${(c.ex||[]).includes(e)?'checked':''} onchange="tgEx('${e}')"> ${e}</label>`).join(' &nbsp; ')}</p></div>
 <div class=card>${ta('hist','Histórico (fornecido pelo solicitante)',60)}${ta('macro','Achados macroscópicos (necropsia)',140)}
 <label class=mut>Histopatologia (montada automaticamente a partir das lâminas)</label>${histo(c).map(t=>`<p>${esc(t)}</p>`).join('')||'<p class=mut>Sem lâminas.</p>'}
 ${ta('compl','Exames complementares (além das colorações pedidas)',60)}${ta('morf','Diagnósticos morfológicos (um por linha)',90)}${ta('concl','Conclusão',80)}${ta('com','Comentários',80)}
 <div class="row noprint"><button class=p onclick="baixar()">⬇ Baixar Word (.doc)</button><button onclick="print()">🖨 Imprimir / PDF</button></div></div>`}
function tgEx(e){const c=C();c.ex=c.ex||[];const i=c.ex.indexOf(e);i<0?c.ex.push(e):c.ex.splice(i,1);save()}
function baixar(){const c=C(),p=(t,x)=>`<p><b>${t}</b><br>${esc(x).replace(/\n/g,'<br>')}</p>`,ck=e=>`[${(c.ex||[]).includes(e)?'x':' '}] ${e}`;
 const h=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Arial;font-size:11pt}td{border:1px solid #000;padding:3px}table{border-collapse:collapse;width:100%}</style></head><body>
 <p align=center><b>UNIVERSIDADE FEDERAL DE MINAS GERAIS<br>ESCOLA DE VETERINÁRIA<br>DEPARTAMENTO DE CLÍNICA E CIRURGIA VETERINÁRIAS<br>SETOR DE PATOLOGIA<br>${esc(c.reg)}</b></p>
 <table><tr><td colspan=2 align=center><b>IDENTIFICAÇÃO</b></td></tr>
 <tr><td colspan=2><b>Proprietário:</b> ${esc(c.prop)} &nbsp; <b>Procedência:</b> ${esc(c.proc)}</td></tr>
 <tr><td colspan=2><b>Nome:</b> ${esc(c.nome)}</td></tr>
 <tr><td><b>Espécie:</b> <i>${esc(c.esp)}</i></td><td><b>Peso:</b> ${esc(c.peso)}</td></tr>
 <tr><td><b>Idade:</b> ${esc(c.idade)}</td><td><b>Sexo:</b> ${esc(c.sexo)}</td></tr>
 <tr><td><b>Morte:</b> ${esc(c.morte)}</td><td><b>Data do óbito:</b> ${br(c.do)}</td></tr>
 <tr><td><b>Data da necropsia:</b> ${br(c.dn)}</td><td><b>Data de recebimento:</b> ${br(c.dr)}</td></tr>
 <tr><td colspan=2><b>Veterinário responsável:</b> ${esc(c.vet)}</td></tr>
 <tr><td colspan=2><b>Patologista responsável:</b> ${esc(c.pat)}</td></tr></table>
 <p><b>Exames realizados:</b> ${EX.map(ck).join(' ')}</p><p><b>Material enviado:</b> [x] Carcaça [ ] Material fixado</p>
 ${p('HISTÓRICO:',c.hist||'')}${p('ACHADOS MACROSCÓPICOS:',c.macro||'')}<p><b>HISTOPATOLOGIA:</b></p>${histo(c).map(t=>`<p>${esc(t)}</p>`).join('')}
 ${p('EXAMES COMPLEMENTARES:',[c.compl||'',...slOf(c.id).flatMap(s=>s.cols.map(r=>`Lâmina ${s.num}: ${r.n}`))].filter(Boolean).join('\n'))}
 ${p('DIAGNÓSTICOS MORFOLÓGICOS:',c.morf||'')}${p('CONCLUSÃO:',c.concl||'')}${p('COMENTÁRIOS:',c.com||'')}<p><b>Pós-graduando(a) responsável:</b> ${esc(c.pos)}</p></body></html>`;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',h],{type:'application/msword'}));a.download=`Laudo_${c.reg.replace(/\W/g,'-')}.doc`;a.click()}
/* ---------- DÚVIDAS ---------- */
function vDuv(){const l=db.duv.filter(d=>d.caso==v.cid);
 return `<div class=card><div class=row><select id=dt><option>Dúvida</option><option>Correção do professor</option></select><input id=dx placeholder="Ex.: Lâmina 3 – célula gigante ou macrófago epitelioide?" style="flex:1"><button class=p onclick="addD()">＋</button></div></div>
 ${l.map(d=>`<div class=card><div class=row><label><input type=checkbox style="width:auto" ${d.ok?'checked':''} onchange="okD('${d.id}')"> <span class=tag>${d.t}</span> ${d.ok?'<s>'+esc(d.x)+'</s>':esc(d.x)}</label><button onclick="rmD('${d.id}')">🗑</button></div></div>`).join('')}`}
function addD(){if(!dx.value.trim())return;db.duv.push({id:uid(),caso:v.cid,t:dt.value,x:dx.value.trim(),ok:false});save();render()}
const okD=id=>{const d=db.duv.find(x=>x.id==id);d.ok=!d.ok;save();render()};
const rmD=id=>{db.duv=db.duv.filter(x=>x.id!=id);save();render()};
function vPauta(){const o=db.duv.filter(d=>!d.ok),cs=[...new Set(o.map(d=>d.caso))];
 return `<div class=row><h3>Pauta para levar ao professor</h3><button onclick="print()">🖨 Imprimir</button></div>`+(cs.map(id=>{const c=db.cases.find(x=>x.id==id);return c?`<div class=card><b>${esc(c.reg)}</b> <span class=mut>${esc(c.proc||'')}</span>${o.filter(d=>d.caso==id).map(d=>`<div>☐ <span class=tag>${d.t}</span> ${esc(d.x)}</div>`).join('')}</div>`:''}).join('')||'<p class=mut>Nenhuma dúvida em aberto. 🎉</p>')}
/* ---------- FILA ---------- */
function vFila(){const all=db.slides.flatMap(s=>{const c=db.cases.find(x=>x.id==s.caso);return c?s.cols.map((r,i)=>({s,c,r,i})):[]});
 const sel=+v.f;return `<div class=row><h3>Fila de colorações</h3><span class=noprint><select onchange="v.f=this.value;render()"><option value=-1 ${sel<0?'selected':''}>Em andamento</option>${S.map((t,i)=>`<option value=${i} ${sel==i?'selected':''}>${t}</option>`).join('')}</select> <button onclick="print()">🖨</button></span></div>`+(
 S.slice(0,3).map((t,k)=>{const l=all.filter(x=>x.r.st==k&&(sel<0||sel==k));if(!l.length)return'';
 const hint=['para cortar','para corar','para ler'][k];
 return `<h4>${t} <span class=mut>(${hint}) · ${l.length}</span></h4>`+l.map(x=>`<div class=card><div class=row><span><b>${esc(x.c.reg)}</b> · lâmina ${x.s.num} (${esc(x.s.org)}) → <b>${esc(x.r.n)}</b><div class=mut>pedido por ${esc(x.r.q)} · ${br(x.r.d)}</div></span><button class="p noprint" onclick="cyc('${x.s.id}',${x.i})">→ ${S[k+1]}</button></div></div>`).join('')}).join('')||(sel==3?all.filter(x=>x.r.st==3).map(x=>`<div class=card>${esc(x.c.reg)} · lâmina ${x.s.num} · ${esc(x.r.n)}</div>`).join(''):'<p class=mut>Nada pendente.</p>'))}
/* ---------- DADOS ---------- */
function vDados(){return `<div class=card><h3>Backup</h3><p class=mut>Os dados ficam salvos neste navegador. Baixe um backup com frequência (e guarde no Drive).</p>
 <div class=row style="justify-content:flex-start"><button class=p onclick="exp()">⬇ Exportar backup (.json)</button><label>Restaurar: <input type=file accept=.json onchange="imp(this.files[0])" style="width:auto"></label></div></div>
 <div class=card><h3>Importar casos da planilha (.csv)</h3><p class=mut>No Sheets: Arquivo → Fazer download → CSV. Entram: Registro, Local, Nome científico, Data da Morte, Sexo, Idade. Casos já existentes são ignorados.</p><input type=file accept=.csv onchange="impCsv(this.files[0])"></div>
 <div class=card><h3>Importar laudos Word (.docx)</h3><p class=mut>Selecione um ou vários laudos no seu modelo. O caso é localizado pelo registro (no laudo ou no nome do arquivo); se já existir, só os campos vazios são preenchidos. Arquivos .doc antigos precisam ser salvos como .docx.</p><input type=file accept=.docx multiple onchange="impDocx(this.files)"></div>
 <div class=card><h3>Listas pré-definidas</h3><div class=row style="justify-content:flex-start"><button onclick="lista('cols','Colorações')">Colorações</button><button onclick="lista('orgaos','Órgãos')">Órgãos</button><button onclick="lista('quem','Quem pede')">Quem pede</button></div></div>`}
function lista(k,n){const t=prompt(n+' (separe por vírgula):',db.cfg[k].join(', '));if(t){db.cfg[k]=t.split(',').map(x=>x.trim()).filter(Boolean);save();render()}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download=`didelphis-backup-${today()}.json`;a.click()}
async function imp(f){if(f&&confirm('Substituir todos os dados atuais pelo backup?')){db=JSON.parse(await f.text());save();render()}}
function csv(t){let r=[],w=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}else if(h=='"')q=1;else if(h==','){w.push(c);c=''}else if(h=='\n'){w.push(c);r.push(w);w=[];c=''}else if(h!='\r')c+=h}w.push(c);r.push(w);return r}
const iso=d=>{const m=(d||'').match(/(\d+)\/(\d+)\/(\d{4})/);if(!m)return'';let[a,b,y]=[+m[1],+m[2],m[3]];if(b>12)[a,b]=[b,a];return`${y}-${String(b).padStart(2,'0')}-${String(a).padStart(2,'0')}`};
async function impCsv(f){if(!f)return;const r=csv(await f.text()),H=r[0].map(x=>x.trim()),g=(row,n)=>(row[H.indexOf(n)]||'').trim();let n=0;
 r.slice(1).forEach(w=>{const reg=g(w,'Registro');if(!reg||db.cases.some(c=>c.reg==reg))return;
 db.cases.push({id:uid(),reg,proc:g(w,'Local'),esp:g(w,'Nome científico')||'Didelphis albiventris',nome:'Gambá',sexo:g(w,'Sexo'),idade:g(w,'Idade'),do:iso(g(w,'Data da Morte')),
 tipo:/^2[1-4]\//.test(reg)?'Retrospectivo':'Prospectivo',st:0,ex:['Necropsia','Histopatologia'],pat:'Professor Dr. Renato de Lima Santos - CRMV MG 4577',pos:'André Duarte Vieira – CRMV MG-34985'});n++});
 save();alert(n+' caso(s) importado(s). Confira as datas.');render()}
function edOrg(id){const o=prompt('Órgão da lâmina:',sl1(id).org);if(o!==null){sl1(id).org=o.trim();save();render()}}
const MP={prop:'Propriet[áa]rio',proc:'Proced[êe]ncia',nome:'Nome',esp:'Esp[ée]cie',peso:'Peso',idade:'Idade',sexo:'Sexo',morte:'Morte',do:'Data do [óo]bito',dn:'Data da necropsia',dr:'Data de recebimento',vet:'Veterin[áa]rio respons[áa]vel',pat:'Patologista respons[áa]vel',pos:'P[óo]s-gradua[a-z]*\\(a\\) respons[áa]vel'};
const ALL=Object.values(MP).join('|');
const pegar=(t,p)=>{const m=t.match(new RegExp('(?:'+p+')\\s*:\\s*([^\\n]*?)\\s*(?=(?:'+ALL+')\\s*:|\\n|$)','i'));return m?m[1].trim():''};
const HD=/^[ \t]*(HIST[ÓO]RICO|ACHADOS MACROSC[ÓO]PICOS|HISTOPATOLOGIA|EXAMES COMPLEMENTARES|DIAGN[ÓO]STICOS MORFOL[ÓO]GICOS|CONCLUS[ÃA]O|COMENT[ÁA]RIOS)[ \t]*:?[ \t]*/gim;
const sk=h=>{h=h.toUpperCase();return h.startsWith('HISTOP')?'histo':h.startsWith('HIST')?'hist':h.startsWith('ACH')?'macro':h.startsWith('EXAMES')?'compl':h.startsWith('DIAG')?'morf':h.startsWith('CONCL')?'concl':'com'};
async function impDocx(fs){let nw=0,up=0,ls=0,er=[];const dg=x=>(x||'').replace(/\D/g,'');
 for(const f of fs){try{

  let c=null;for(const x of cand){c=db.cases.find(k=>dg(k.reg).length>=5&&dg(x).includes(dg(k.reg)));if(c)break}

  const set=(k,x)=>{if(x&&!c[k])c[k]=x};
  for(const k in MP){let x=pegar(ident,MP[k]);if(['do','dn','dr'].includes(k))x=iso(x);set(k,x)}
  c.ex=c.ex||[];for(const m of ident.matchAll(/\[\s*[xX]\s*\]\s*(Necropsia|Histopatologia|Bacteriologia|Toxicol[óo]gico|Virol[óo]gico|Parasitol[óo]gico|Outros)/gi)){const e=EX.find(z=>z.toLowerCase().slice(0,5)==m[1].toLowerCase().slice(0,5));if(e&&!c.ex.includes(e))c.ex.push(e)}
  const sec={};ms.forEach((m,i)=>{let x=t.slice(m.index+m[0].length,i+1<ms.length?ms[i+1].index:t.length);if(i+1==ms.length)x=x.split(/\n\s*P[óo]s-gradua/i)[0];x=x.replace(/\n{2,}/g,'\n').trim();if(sk(m[1])=='hist')x=x.replace(/^Fornecido pelo solicitante\s*:?\s*/i,'');sec[sk(m[1])]=x});
  for(const k of ['hist','macro','compl','morf','concl','com'])set(k,sec[k]);

  if(!nl.length&&sec.histo)nl.push({num:1,desc:sec.histo});

 }catch(e){er.push(f.name)}}
 save();render();alert(`${nw} caso(s) novo(s), ${up} atualizado(s), ${ls} lâmina(s) com descrição importada.`+(er.length?`\nNão foi possível ler: ${er.join(', ')}`:'')+'\nRevise cada caso: o órgão das lâminas precisa ser preenchido (✏ órgão).')}
